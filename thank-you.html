<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank You | Tee’s Consults</title>
<style>
:root{--g:#0b7a35;--gl:#e8f5ec;--bg:#fff;--tx:#14231a;--mu:#4a5d51;--bd:#d3e8da}
@media (prefers-color-scheme:dark){:root{--g:#3fcf74;--gl:#12301e;--bg:#0c1710;--tx:#e8f3ec;--mu:#a3b8ab;--bd:#24402f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--gl),var(--bg) 70%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;padding:24px}
.box{max-width:520px;text-align:center}
.tick{width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;font-size:2.4rem;display:grid;place-items:center;margin:0 auto 20px}
h1{font-size:clamp(1.8rem,6vw,2.4rem);margin:0 0 12px;line-height:1.15}
p{color:var(--mu);margin:0 0 12px;font-size:1.05rem}
.logo{font-weight:800;color:var(--g);margin-bottom:26px}
a{color:var(--g);font-weight:700}
.home{display:inline-block;margin-top:14px;padding:14px 26px;border-radius:12px;border:2px solid var(--g);background:var(--g);color:#fff;text-decoration:none;font-weight:700}
@media (prefers-color-scheme:dark){.home{color:#06210f}}
</style>
<!-- Meta Pixel Code -->
<script>

{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];

fbq('init', '1142456525002629');

</script>
<!-- End Meta Pixel Code -->
</head>
<body>
<main class="box">
<div class="logo">TEE’S CONSULTS</div>
<div class="tick">✓</div>
<h1>Thank you. We have received your request.</h1>
<p>Our team will call you on the phone number you gave. Please keep your phone close.</p>
<p>If it is urgent, you can call us on <a href="tel:+2348109459250">08109459250</a>.</p>
<a class="home" href="index.html">Back to Home</a>
</main>
<script>
/* Lead is counted only here, and only when the form really sent (flag set on the main page). */
(function(){
var store=true,flag=null;
try{sessionStorage.setItem('tc_t','1');sessionStorage.removeItem('tc_t');flag=sessionStorage.getItem('tc_lead');sessionStorage.removeItem('tc_lead')}catch(e){store=false}
if(store&&flag!=='1'){window.location.replace('index.html');return}
fbq('track','Lead');
})();
</script>
</body>
</html>
